apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops
  namespace: devops
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: devops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: devops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: devops
        nodeTaintsPolicy: Honor
      containers:
      - name: app
        image: pichincha-devops:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: devops-auth
        env:
        - name: REDIS_URL
          value: redis://redis:6379/0
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -c
              - import time; time.sleep(10)
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: devops
  namespace: devops
spec:
  clusterIP: None
  selector:
    app: devops
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops
  namespace: devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devops
  namespace: devops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: devops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: devops
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: devops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        command:
        - redis-server
        - --appendonly
        - 'yes'
        - --appendfsync
        - always
        - --maxmemory-policy
        - noeviction
        ports:
        - containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: devops
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kong
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: kong
        nodeTaintsPolicy: Honor
      containers:
      - name: kong
        image: kong:3.9.1@sha256:76c14b93e989f7f4418039f7f9789ca32564016211c86ac1a18022f4788e7b9c
        ports:
        - containerPort: 8443
        - containerPort: 8100
        env:
        - name: KONG_DATABASE
          value: 'off'
        - name: KONG_DECLARATIVE_CONFIG
          value: /config/kong.json
        - name: KONG_PROXY_LISTEN
          value: 0.0.0.0:8443 ssl
        - name: KONG_ADMIN_LISTEN
          value: 'off'
        - name: KONG_STATUS_LISTEN
          value: 0.0.0.0:8100
        - name: KONG_SSL_CERT
          value: /tls/tls.crt
        - name: KONG_SSL_CERT_KEY
          value: /tls/tls.key
        - name: KONG_PROXY_ACCESS_LOG
          value: 'off'
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_NGINX_WORKER_PROCESSES
          value: '2'
        - name: KONG_ERROR_TEMPLATE_JSON
          value: /config/error.txt
        - name: KONG_ERROR_TEMPLATE_PLAIN
          value: /config/error.txt
        - name: KONG_ERROR_TEMPLATE_HTML
          value: /config/error.txt
        - name: KONG_ERROR_TEMPLATE_XML
          value: /config/error.txt
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /status/ready
            port: 8100
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /status
            port: 8100
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /status
            port: 8100
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: kong-config
      - name: tls
        secret:
          secretName: devops-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: devops
spec:
  type: LoadBalancer
  selector:
    app: kong
  ports:
  - name: https
    port: 443
    targetPort: 8443
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kong
  namespace: devops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kong
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: devops
spec:
  podSelector:
    matchLabels:
      app: devops
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kong
    ports:
    - port: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: devops
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: devops
    ports:
    - port: 6379
      protocol: TCP
