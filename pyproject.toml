[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "pichincha-devops-assessment"
version = "1.0.0"
description = "Transactional REST service for the DevOps assessment"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "PyJWT>=2.10,<3",
  "redis>=5,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1",
  "fakeredis>=2.27,<3", "ruff>=0.11,<1", "bandit>=1.8,<2",
  "pip-audit>=2.9,<3", "build>=1.2,<2", "PyYAML>=6,<7", "cryptography>=44,<49",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devops_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["integration: requires a real Redis server"]

[tool.coverage.run]
source = ["devops_service"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
