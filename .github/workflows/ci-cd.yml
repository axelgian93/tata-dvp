name: DevOps CI/CD
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Optional previous release digest: sha256:... (master only)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m build --no-isolation
      - run: docker build --provenance=false --platform linux/amd64 --tag pichincha-devops:local .
      - run: docker save pichincha-devops:local | gzip > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: |
            image.tar.gz
            dist/
          retention-days: 3
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m bandit -r src -q
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
      - run: python -m pytest --cov=devops_service --cov-report=xml --junitxml=test-results.xml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
      - run: gunzip -c image.tar.gz | docker load
      - run: python -m scripts.prepare_local
      - run: docker compose up -d --no-build --wait --wait-timeout 120
      - run: python -m scripts.smoke --require-two-backends
      - if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-evidence
          path: |
            coverage.xml
            test-results.xml
          retention-days: 14
  infrastructure:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KUBECONFIG: ${{ github.workspace }}/.runtime/kubeconfig-kind
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
      - run: gunzip -c image.tar.gz | docker load
      - run: python -m scripts.prepare_local
      - name: Install verified kind
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLo kind.sha256 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          echo "$(cut -d ' ' -f 1 kind.sha256)  kind" | sha256sum --check
          chmod +x kind
      - run: ./kind create cluster --name devops-assessment --config infra/kind.yaml --kubeconfig "$KUBECONFIG" --wait 120s
      - run: ./kind load docker-image pichincha-devops:local --name devops-assessment
      - run: kubectl apply -f infra/k8s/bootstrap.yaml
      - run: kubectl apply -f infra/metrics-server-kind.yaml
      - run: python -m scripts.deploy --local --image pichincha-devops:local
      - run: python -m scripts.smoke --url https://localhost:9443 --require-two-backends
      - if: always()
        run: ./kind delete cluster --name devops-assessment
  publish:
    needs: [test, infrastructure]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
      - name: Publish the exact tested image or select an existing release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REQUESTED_DIGEST: ${{ inputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          if [[ -n "$REQUESTED_DIGEST" ]]; then
            [[ "$REQUESTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
            docker pull "$IMAGE@$REQUESTED_DIGEST"
            REF="$IMAGE@$REQUESTED_DIGEST"
          else
            gunzip -c image.tar.gz | docker load
            docker tag pichincha-devops:local "$IMAGE:$COMMIT"
            docker push "$IMAGE:$COMMIT"
            REF=$(docker image inspect "$IMAGE:$COMMIT" --format '{{index .RepoDigests 0}}')
          fi
          echo "image=$REF" >> "$GITHUB_OUTPUT"
          echo "Release: $REF" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker logout ghcr.io
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      KUBECONFIG: ${{ github.workspace }}/.runtime/kubeconfig
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - name: Install pinned kubectl
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - name: Configure cluster credentials
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p .runtime
          python -c "import os,base64,pathlib; p=pathlib.Path(os.environ['KUBECONFIG']); p.write_bytes(base64.b64decode(os.environ['KUBECONFIG_B64'],validate=True)); p.chmod(0o600)"
          kubectl version --client
      - name: Deploy immutable release
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          API_KEY: ${{ secrets.API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TLS_CERT_B64: ${{ secrets.TLS_CERT_B64 }}
          TLS_KEY_B64: ${{ secrets.TLS_KEY_B64 }}
        run: python -m scripts.deploy --image "$IMAGE"
      - name: Verify public HTTPS endpoint
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: python -m scripts.smoke --url "$PUBLIC_URL" --public-ca --require-two-backends
      - if: always()
        run: rm -f "$KUBECONFIG"
